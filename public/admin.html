<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D32">
  <title>Admin Dashboard | MCitizen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="admin.html" class="logo" aria-label="MCitizen admin">
        <!-- LOGO WITH FALLBACK -->
        <img src="muranga-logo.png" alt="Murang'a County Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="logo-mark" style="display: none;">M</span>
        
        <span class="logo-text">MCitizen<small>Admin console</small></span>
      </a>
      <nav class="nav-links" style="display:flex;position:static;background:none;padding:0;box-shadow:none;flex-direction:row;align-items:center;">
        <span class="badge badge-admin" id="adminName">Admin</span>
        <button type="button" class="btn btn-outline btn-sm" id="logoutBtn" data-i18n="Logout">Logout</button>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">

      <h1 style="font-size:1.5rem" data-i18n="County requests overview">County requests overview</h1>
      <p class="text-muted" data-i18n="Review citizen requests and update their progress.">Review citizen requests and update their progress.</p>

      <!-- Analytics -->
      <section class="stat-cards" aria-label="Analytics">
        <div class="stat-card open">
          <div class="stat-icon" aria-hidden="true">&#128194;</div>
          <div>
            <div class="stat-number" id="openCount">-</div>
            <div class="stat-label" data-i18n="Total Open Cases">Total Open Cases</div>
            <div class="cell-sub" id="openBreakdown"></div>
          </div>
        </div>
        <div class="stat-card resolved">
          <div class="stat-icon" aria-hidden="true">&#9989;</div>
          <div>
            <div class="stat-number" id="resolvedCount">-</div>
            <div class="stat-label" data-i18n="Total Resolved Cases">Total Resolved Cases</div>
            <div class="cell-sub" id="resolvedBreakdown"></div>
          </div>
        </div>
      </section>

      <!-- Filters -->
      <div class="toolbar">
        <input type="text" id="searchInput" data-i18n-placeholder="Search by name, category or ward" placeholder="Search by name, category or ward" aria-label="Search requests" autocomplete="off">
        
        <!-- FIXED: Added value="..." attributes -->
        <select id="statusFilter" aria-label="Filter by status">
          <option value="" data-i18n="All statuses">All statuses</option>
          <option value="Pending" data-i18n="Pending">Pending</option>
          <option value="In Progress" data-i18n="In Progress">In Progress</option>
          <option value="Resolved" data-i18n="Resolved">Resolved</option>
        </select>
        
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="" data-i18n="All categories">All categories</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="User">User</th>
              <th data-i18n="Category">Category</th>
              <th data-i18n="Sub-category">Sub-category</th>
              <th data-i18n="Location">Location</th>
              <th data-i18n="Specific Location">Specific Location</th>
              <th data-i18n="Status">Status</th>
              <th data-i18n="Image">Image</th>
              <th data-i18n="Update status">Update status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8"><div class="loader" data-i18n="Loading requests...">Loading requests...</div></td></tr> 
          </tbody>
        </table>
      </div>
      <p class="text-muted mt-1" id="rowCount" style="font-size:.85rem"></p>
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true"><img id="lightboxImg" alt="Request evidence"></div>
  <div class="toast-container" id="toasts"></div>

  <script>
    // ---------- Auth guard (admin only) ----------
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    if (!token || role !== 'admin') {
      window.location.replace(role === 'citizen' && token ? 'citizen.html' : 'login.html');
    }

    function logout() {
      ['role', 'name', 'constituency', 'ward', 'userId', 'token'].forEach((k) => localStorage.removeItem(k));
      window.location.href = 'login.html';
    }

    const $ = (id) => document.getElementById(id);
    $('logoutBtn').addEventListener('click', logout);
    $('adminName').textContent = 'Admin: ' + (localStorage.getItem('name') || 'Administrator');

    const STATUSES = ['Pending', 'In Progress', 'Resolved'];
    let allRequests = [];

    // ---------- Helpers ----------
    async function api(url, options) {
      const opts = options || {};
      opts.headers = Object.assign({ 'x-auth-token': token }, opts.headers || {});
      const res = await fetch(url, opts);
      if (res.status === 401 || res.status === 403) { logout(); throw new Error('Unauthorized'); }
      return res.json();
    }

    function toast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type || 'success');
      t.textContent = msg;
      $('toasts').appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function statusClass(status) {
      return status === 'Resolved' ? 'resolved' : status === 'In Progress' ? 'in-progress' : 'pending';
    }

    function formatDate(s) {
      if (!s) return '';
      const d = new Date(String(s).replace(' ', 'T') + 'Z'); // SQLite stores UTC
      return isNaN(d) ? s : d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function cell(label, ...children) {
      const td = document.createElement('td');
      td.dataset.label = label; 
      children.forEach((c) => td.append(c));
      return td;
    }
    function textWithSub(main, sub) {
      const frag = document.createDocumentFragment();
      frag.append(document.createTextNode(main));
      if (sub) {
        const s = document.createElement('span');
        s.className = 'cell-sub';
        s.textContent = sub;
        frag.append(s);
      }
      return frag;
    }

    // Helper to get current language dictionary for dynamic JS strings
    function t(key) {
      const lang = localStorage.getItem('lang') || 'en';
      if (typeof translations !== 'undefined' && translations[lang] && translations[lang][key]) {
        return translations[lang][key];
      }
      return key; // Fallback to English if not found
    }

    // ---------- Analytics ----------
    async function loadAnalytics() {
      try {
        const d = await api('/api/admin/analytics');
        if (!d.success) return;
        $('openCount').textContent = d.open;
        $('resolvedCount').textContent = d.resolved;
        
        // Dynamic translations for breakdown
        $('openBreakdown').textContent = d.pending + ' ' + t('Pending').toLowerCase() + ', ' + d.inProgress + ' ' + t('In Progress').toLowerCase();
        $('resolvedBreakdown').textContent = t('Out of ') + d.total + ' ' + t('total requests');
      } catch (e) { /* handled in api() */ }
    }

    // ---------- Table ----------
    function applyFilters() {
      const q = $('searchInput').value.trim().toLowerCase();
      const st = $('statusFilter').value;
      const cat = $('categoryFilter').value;
      const rows = allRequests.filter((r) => {
        if (st && r.status !== st) return false;
        if (cat && r.category !== cat) return false;
        if (!q) return true;
        return [r.user_name, r.category, r.sub_category, r.ward, r.constituency, r.location_details, r.description]
          .join(' ').toLowerCase().includes(q);
      });
      renderTable(rows);
    }

    function renderTable(rows) {
      const body = $('tableBody');
      body.innerHTML = '';

      if (!rows.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 8; 
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.style.border = '0';
        empty.textContent = allRequests.length ? t('No requests match your filters.') : t('No requests have been submitted yet.');
        td.appendChild(empty);
        tr.appendChild(td);
        body.appendChild(tr);
        $('rowCount').textContent = '';
        return;
      }

      rows.forEach((r) => {
        const tr = document.createElement('tr');
        tr.id = 'row-' + r.id;

        // Status pill (Translates the status text dynamically)
        const pill = document.createElement('span');
        pill.className = 'status-pill ' + statusClass(r.status);
        pill.textContent = t(r.status);

        // Image
        const imgWrap = document.createDocumentFragment();
        if (r.image_url) {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = r.image_url;
          img.alt = 'Evidence for request #' + r.id;
          img.loading = 'lazy';
          img.addEventListener('click', () => openLightbox(r.image_url));
          imgWrap.append(img);
        } else {
          const none = document.createElement('span');
          none.className = 'no-image';
          none.textContent = t('No image');
          imgWrap.append(none);
        }

        // Status select (Translates the dropdown options dynamically)
        const select = document.createElement('select');
        select.className = 'status-select';
        select.setAttribute('aria-label', 'Update status for request #' + r.id);
        STATUSES.forEach((s) => {
          const opt = new Option(t(s), s); // t(s) translates, s is the actual value
          if (s === r.status) opt.selected = true;
          select.add(opt);
        });
        select.addEventListener('change', () => updateStatus(r, select, pill));

        tr.append(
          cell(t('User'), textWithSub(r.user_name || 'Unknown user', formatDate(r.created_at) + ' \u2022 #' + r.id)),
          cell(t('Category'), document.createTextNode(r.category)),
          cell(t('Sub-category'), textWithSub(r.sub_category, r.description.length > 60 ? r.description.slice(0, 60) + '...' : r.description)),
          cell(t('Location'), textWithSub(r.ward, r.constituency)),
          cell(t('Specific Location'), document.createTextNode(r.location_details || 'Not specified')), 
          cell(t('Status'), pill),
          cell(t('Image'), imgWrap),
          cell(t('Update'), select)
        );
        body.appendChild(tr);
      });

      $('rowCount').textContent = t('Showing ') + rows.length + ' ' + t('of') + ' ' + allRequests.length + ' ' + t('requests');
    }

    async function updateStatus(request, select, pill) {
      const previous = request.status;
      const next = select.value;
      select.disabled = true;
      try {
        const d = await api('/api/admin/requests/' + request.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: next })
        });
        if (d.success) {
          request.status = next;
          pill.className = 'status-pill ' + statusClass(next);
          pill.textContent = t(next); // Translated
          toast('Request #' + request.id + ' marked as ' + t(next).toLowerCase() + '.');
          loadAnalytics();
        } else {
          select.value = previous;
          toast(d.message || 'Could not update status.', 'error');
        }
      } catch (e) {
        select.value = previous;
        toast('Could not reach the server.', 'error');
      } finally {
        select.disabled = false;
      }
    }

    async function loadRequests() {
      try {
        const d = await api('/api/admin/requests');
        allRequests = d.success ? d.requests : [];

        // Populate category filter from the data
        const cats = Array.from(new Set(allRequests.map((r) => r.category))).sort();
        const sel = $('categoryFilter');
        sel.length = 1;
        cats.forEach((c) => sel.add(new Option(c, c)));

        applyFilters();
      } catch (e) {
        $('tableBody').innerHTML = '';
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 8; 
        td.textContent = t('Could not load requests. Please refresh the page.');
        tr.appendChild(td);
        $('tableBody').appendChild(tr);
      }
    }

    // ---------- Lightbox ----------
    function openLightbox(src) {
      $('lightboxImg').src = src;
      $('lightbox').classList.add('open');
      $('lightbox').setAttribute('aria-hidden', 'false');
    }
    function closeLightbox() {
      $('lightbox').classList.remove('open');
      $('lightbox').setAttribute('aria-hidden', 'true');
    }
    $('lightbox').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    // ---------- Filters ----------
    $('searchInput').addEventListener('input', applyFilters);
    $('statusFilter').addEventListener('change', applyFilters);
    $('categoryFilter').addEventListener('change', applyFilters);

    // ---------- Init ----------
    loadAnalytics();
    loadRequests();
    setInterval(() => { loadAnalytics(); }, 30000); 
  </script>
  
  <script src="shared.js"></script>
</body>
</html>
