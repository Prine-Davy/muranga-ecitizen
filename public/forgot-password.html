<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D32">
  <title>Forgot Password | MCitizen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVIGATION (Consistent with other pages) -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="MCitizen home">
        <!-- LOGO WITH FALLBACK -->
        <img src="muranga-logo.png" alt="Murang'a County Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="logo-mark" style="display: none;">M</span>
        
        <span class="logo-text">MCitizen<small>Murang'a County</small></span>
      </a>
      <nav class="nav-links" style="display:flex;position:static;background:none;padding:0;box-shadow:none;flex-direction:row;">
        <a href="login.html" class="btn btn-outline btn-sm" data-i18n="Back to Login">Back to Login</a>
      </nav>
    </div>
  </header>

  <!-- APPLLY THE SAME BACKGROUND AS LOGIN -->
  <main class="auth-wrapper bg-login">
    <div class="auth-card" style="max-width: 450px;">

      <div class="auth-header">
        <div class="logo-mark">M</div>
        <h1 data-i18n="Forgot Password?">Forgot Password?</h1>
        <p data-i18n="Enter your email address and we'll send you a link to reset your password.">Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email" data-i18n="Email Address*">Email Address <span class="req">*</span></label>
          <input type="email" id="email" required placeholder="Enter your registered email" data-i18n-placeholder="Enter your registered email">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="Send Reset Link">Send Reset Link</button>
      </form>

      <p class="auth-footer">
        <a href="/login.html" data-i18n="Back to Login" style="color: #1976D2; text-decoration: none;">Back to Login</a>
      </p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    
    $('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = $('email').value;
      const btn = $('submitBtn');
      
      // Loading state
      btn.textContent = t('Sending...') || 'Sending...'; 
      btn.disabled = true;

      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        
        // Show success/error messages
        alert(data.message);
        
        if (data.success) {
          window.location.href = '/login.html';
        } else {
          btn.textContent = t('Send Reset Link') || 'Send Reset Link';
          btn.disabled = false;
        }
      } catch (err) {
        alert(t('Could not reach the server. Check your connection and try again.') || 'Could not reach the server.');
        btn.textContent = t('Send Reset Link') || 'Send Reset Link';
        btn.disabled = false;
      }
    });

    // Fallback translation function if shared.js hasn't loaded yet
    function t(key) {
      if (typeof window.t === 'function') return window.t(key);
      return key;
    }
  </script>
  
  <script src="shared.js"></script>
</body>
</html>
