<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D32">
  <title>Forgot Password | MCitizen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="MCitizen home">
        <!-- LOGO WITH FALLBACK -->
        <img src="muranga-logo.png" alt="Murang'a County Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="logo-mark" style="display: none;">M</span>
        
        <span class="logo-text">MCitizen<small>Murang'a County</small></span>
      </a>
      <nav class="nav-links" style="display:flex;position:static;background:none;padding:0;box-shadow:none;flex-direction:row;">
        <a href="login.html" class="btn btn-outline btn-sm" data-i18n="Back to Login">Back to Login</a>
      </nav>
    </div>
  </header>

  <!-- APPLIES THE SAME BACKGROUND AS LOGIN -->
  <main class="auth-wrapper bg-login">
    <div class="auth-card" style="max-width: 450px;">

      <div class="auth-header">
        <!-- LOGO WITH FALLBACK INSIDE CARD -->
        <img src="muranga-logo.png" alt="Murang'a County Logo" class="auth-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-mark" style="display: none; margin: 0 auto 15px auto;">M</div>
        
        <h1 data-i18n="Forgot Password?">Forgot Password?</h1>
        <p data-i18n="Enter your email address and we'll send you a link to reset your password.">Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email" data-i18n="Email Address*">Email Address <span class="req">*</span></label>
          <input type="email" id="email" required placeholder="Enter your registered email" data-i18n-placeholder="Enter your registered email">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="Send Reset Link">Send Reset Link</button>
      </form>

      <!-- DEMO RESET LINK BOX (Hidden by default) -->
      <div id="demoLinkBox" class="hidden" style="margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #2E7D32; border-radius: 8px; text-align: center;">
        <p style="margin: 0 0 10px 0; font-size: 14px; font-weight: bold; color: #1A1A1A;">Demo Mode: Email blocked by server. Click below to reset:</p>
        <a id="demoLink" href="#" style="color: #1976D2; word-break: break-all; font-size: 13px;">Reset Link</a>
      </div>

      <p class="auth-footer">
        <a href="/login.html" data-i18n="Back to Login" style="color: #1976D2; text-decoration: none;">Back to Login</a>
      </p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    
    $('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = $('email').value;
      const btn = $('submitBtn');
      
      // Loading state
      btn.textContent = "Sending..."; 
      btn.disabled = true;

      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        
        if (data.success) {
          if (data.demoResetLink) {
            // DEMO MODE: Show the link on screen instead of redirecting
            $('demoLink').href = data.demoResetLink;
            $('demoLink').textContent = data.demoResetLink;
            $('demoLinkBox').classList.remove('hidden');
            btn.textContent = "Send Reset Link";
            btn.disabled = false;
            alert("Email blocked by server. Use the link below to reset your password.");
          } else {
            // Normal mode: Redirect to login
            alert(data.message);
            window.location.href = '/login.html';
          }
        } else {
          alert(data.message || "Failed to send reset link.");
          btn.textContent = "Send Reset Link";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Could not reach the server. Check your connection and try again.");
        btn.textContent = "Send Reset Link";
        btn.disabled = false;
      }
    });
  </script>
  
  <script src="shared.js"></script>
</body>
</html>
