<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D32">
  <title>Reset Password | MCitizen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="MCitizen home">
        <!-- LOGO WITH FALLBACK -->
        <img src="muranga-logo.png" alt="Murang'a County Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="logo-mark" style="display: none;">M</span>
        
        <span class="logo-text">MCitizen<small>Murang'a County</small></span>
      </a>
      <nav class="nav-links" style="display:flex;position:static;background:none;padding:0;box-shadow:none;flex-direction:row;">
        <a href="login.html" class="btn btn-outline btn-sm" data-i18n="Back to Login">Back to Login</a>
      </nav>
    </div>
  </header>

  <!-- APPLIES THE SAME BACKGROUND AS LOGIN -->
  <main class="auth-wrapper bg-login">
    <div class="auth-card" style="max-width: 450px;">

      <div class="auth-header">
        <div class="logo-mark">M</div>
        <h1 data-i18n="Set New Password">Set New Password</h1>
        <p data-i18n="Please enter your new strong password below.">Please enter your new strong password below.</p>
      </div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword" data-i18n="New Password*">New Password <span class="req">*</span></label>
          <div class="input-wrap">
            <input type="password" id="newPassword" required placeholder="Min 8 chars, Upper, Lower, Num, Symbol" data-i18n-placeholder="Min 8 chars, Upper, Lower, Num, Symbol">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Show password" data-i18n="Show">Show</button>
          </div>
          <div class="form-hint" data-i18n="Must be at least 8 characters and include a number and a special character.">Must be at least 8 characters and include a number and a special character.</div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="Reset Password">Reset Password</button>
      </form>

      <p class="auth-footer">
        <a href="/login.html" data-i18n="Back to Login" style="color: #1976D2; text-decoration: none;">Back to Login</a>
      </p>
    </div>
  </main>

  <script>
    // Extract the token from the URL (e.g., reset-password.html?token=abc123)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      alert("Invalid reset link. Please request a new one.");
      window.location.href = '/login.html';
    }

    // Show/Hide Password Toggle
    function togglePassword() {
      const input = document.getElementById('newPassword');
      const btn = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const btn = document.getElementById('submitBtn');
      
      // Basic client-side validation
      if (newPassword.length < 8) {
        alert("Password must be at least 8 characters long.");
        return;
      }

      // Loading state
      btn.textContent = "Resetting...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await response.json();
        alert(data.message);
        
        if (data.success) {
          window.location.href = '/login.html';
        } else {
          btn.textContent = "Reset Password";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Could not reach the server. Please try again.");
        btn.textContent = "Reset Password";
        btn.disabled = false;
      }
    });
  </script>
  
  <script src="shared.js"></script>
</body>
</html>
